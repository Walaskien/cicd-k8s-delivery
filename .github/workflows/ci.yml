name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to main must not kill a run that is halfway through publishing
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.4
  KIND_VERSION: v0.33.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: yamllint -s .
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: helm lint chart/greeter --strict
      - name: kubeconform
        run: |
          helm template greeter chart/greeter |
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Build once and hand the same tarball to the deploy and publish jobs, so
  # the image that gets pushed is the one that was tested in kind.
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: greeter:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/greeter.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/greeter.tar
          retention-days: 1

  deploy-kind:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/greeter.tar"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          config: kind/cluster.yaml
          cluster_name: ci
      - name: load image into kind
        run: kind load docker-image "greeter:${GITHUB_SHA}" --name ci
      - name: deploy and smoke test
        run: scripts/deploy.sh greeter "$GITHUB_SHA"
      - name: cluster state
        if: failure()
        run: |
          kubectl -n demo get all
          kubectl -n demo describe pods
          kubectl -n demo logs -l app.kubernetes.io/name=greeter --all-containers --tail=50
          helm history greeter -n demo

  publish:
    needs: deploy-kind
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/greeter.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        run: |
          # registry paths must be lowercase, the GitHub owner name is not
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag "greeter:${GITHUB_SHA}" "$repo:${GITHUB_SHA}"
          docker tag "greeter:${GITHUB_SHA}" "$repo:latest"
          docker push "$repo:${GITHUB_SHA}"
          docker push "$repo:latest"
